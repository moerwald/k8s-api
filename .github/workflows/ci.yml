name: CI

# Builds the API and runs all tests on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/K8sApi.Tests/K8sApi.Tests.csproj

      - name: Build
        run: dotnet build tests/K8sApi.Tests/K8sApi.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test tests/K8sApi.Tests/K8sApi.Tests.csproj
          --no-build --configuration Release
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      # Shows every failed test as an error annotation on the run and the pull request.
      - name: Show failed tests
        if: always()
        shell: python
        run: |
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          def esc(s): return s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          passed, failed = 0, []
          for f in glob.glob("TestResults/**/*.trx", recursive=True):
              root = ET.parse(f).getroot()
              for r in root.iterfind(".//t:UnitTestResult", ns):
                  if r.get("outcome") == "Passed":
                      passed += 1
                  if r.get("outcome") != "Failed":
                      continue
                  failed.append(r.get("testName"))
                  msg = r.find(".//t:ErrorInfo/t:Message", ns)
                  text = (msg.text or "").strip() if msg is not None else ""
                  print(f"::error title=Test failed: {r.get('testName')}::{esc(text)}")
          # GitHub shows only 10 errors per step, so also write one summary with all failed tests.
          summary = f"Passed: {passed}, Failed: {len(failed)}\n" + "\n".join(sorted(failed))
          print(f"::notice title=Test summary::{esc(summary)}")

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
