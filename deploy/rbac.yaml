# Read-only rights for the API. This will move into the Helm chart later.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-api
  namespace: k8s-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-api-reader
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "gateways"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-api-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-api-reader
subjects:
  - kind: ServiceAccount
    name: k8s-api
    namespace: k8s-api
